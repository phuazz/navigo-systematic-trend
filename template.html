    <td class="r num">${wasCell(x.to,x.from)}</td>
    <td class="r num ${signClass(x.delta)}">${pctSigned(x.delta,1)}</td></tr>`).join('') : '<tr><td colspan="7" class="muted" style="padding:14px">No matching trades.</td></tr>';
  const cc=document.getElementById('blotCount'); if(cc) cc.textContent=total+' match'+(total===1?'':'es')+(total>250?' · showing 250':'');
}

function renderHealth(){
  const h=DS.health, m=DS.meta, rc=DS.stats.reconcile, ch=DS.changes;
  const lvlTxt={ok:'All checks passed',warn:'Attention — a feed is near its freshness budget',stale:'Stale or inconsistent data detected'}[h.level];
  const lvlCls={ok:'pos',warn:'',stale:'neg'}[h.level];
  const feedUnit=f=>((f.basis||'business days').indexOf('session')>=0?'sessions':'bdays');
  const feedRow=f=>`<tr><td>${esc(f.feed)}${f.source?`<br><span class="muted" style="font-size:11px">${esc(f.source)}</span>`:''}</td><td class="num">${fmtDate(f.asOf)}</td>
    <td class="r num" title="Measured in ${esc(f.basis||'business days')}">${f.bday_lag==null?'—':f.bday_lag}</td>
    <td class="r num">${f.budget_bdays} <span class="muted" style="font-size:11px">${feedUnit(f)}</span></td>
    <td class="c"><span class="pill pill-health-${f.level}" style="padding:2px 8px">${f.level.toUpperCase()}</span></td>
    <td class="num muted" style="font-size:11px">${esc((f.computed_at||'').replace('T',' ').slice(0,16))}</td></tr>`;
  const recRow=k=>{ const ok=(rc.diffs[k]||0)<=rc.tol[k];
    return `<tr><td>${k}</td><td class="r num">${num(rc.recomputed[k],4)}</td><td class="r num">${num(DS.stats.engine_stats[k],4)}</td>
    <td class="r num">${num(rc.diffs[k],4)}</td><td class="r num muted">${rc.tol[k]}</td><td class="c">${ok?'<span class="pos">✓</span>':'<span class="neg">✕</span>'}</td></tr>`; };
  const el=document.getElementById('tabContent');
  el.innerHTML = `
    <div class="card">
      <div class="card-h"><div class="card-title">Data integrity status</div><span class="pill pill-health-${h.level}">${h.level==='ok'?'✓ OK':h.level==='warn'?'⚠ WARN':'✕ STALE'}</span></div>
      <div style="font-size:18px;font-weight:700;margin-bottom:6px" class="${lvlCls}">${lvlTxt}</div>
      ${h.messages.length?`<ul style="margin:8px 0 0 18px;font-size:13px;color:var(--t2)">${h.messages.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div class="muted" style="font-size:13px">No warnings. All feeds within budget; regime since-date reconciles with the latest event; recomputed statistics match the engine.</div>'}
      <div class="callout" style="margin-top:14px;font-size:12px">This tab exists because the upstream engine once published a confident regime state on an 11-week-stale breadth panel. The monitor now checks feed freshness — the live NAV against the last completed NYSE session, the weekly feeds against business-day budgets — plus the regime since-date against the latest switch event, and recomputed statistics against the engine's own figures, on every build.</div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:12px">Feed freshness</div>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Feed</th><th>As of</th><th class="r">Lag</th><th class="r">Budget</th><th class="c">Status</th><th>Engine computed</th></tr></thead>
      <tbody>${h.feeds.map(feedRow).join('')}</tbody></table></div>
      <div class="card-note" style="margin-top:8px">The live NAV refreshes daily and is measured in NYSE sessions against the last completed session — a budget of zero, so one session behind reads STALE. The breadth panel and the strategy-equity backtest regenerate in the weekly run, so they trail by design and keep wider business-day budgets. The headline model is extended to the live NAV date regardless of the backtest curves. The S&amp;P 500 row measures the engine's benchmark export (plus its yfinance extension) in sessions behind the NAV's own as-of: one behind is WARN and every S&amp;P-relative figure carries a date caveat; the series is never forward-filled onto a date it has no bar for.</div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-title" style="margin-bottom:12px">Statistics reconciliation</div>
        <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Metric</th><th class="r">Recomputed</th><th class="r">Engine</th><th class="r">|Δ|</th><th class="r">Tol</th><th class="c">✓</th></tr></thead>
        <tbody>${['sharpe','cagr','total_return','max_dd'].map(recRow).join('')}</tbody></table></div>
        <div class="card-note" style="margin-top:8px">Recomputed on the backtest window (excludes the live extension), so it is an apples-to-apples check against the engine's published figures.</div>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:12px">Provenance</div>
        <div class="kv">
          <div class="k">Source engine</div><div class="v"><a href="https://github.com/${esc(m.source_repo)}" target="_blank" rel="noopener">${esc(m.source_repo)}</a></div>
          <div class="k">Commit</div><div class="v num">${esc((m.source_commit||'—').slice(0,10))}</div>
          <div class="k">Model data as of</div><div class="v">${fmtDate(m.asOf)}</div>
          <div class="k">Live NAV as of</div><div class="v">${fmtDate(m.live_asOf)}</div>
          <div class="k">Monitor built</div><div class="v num" style="font-size:11px">${esc((m.built_at_utc||'').replace('T',' ').replace('Z',' UTC'))}</div>
          <div class="k">Benchmark feed</div><div class="v">${h.benchmark_ok?'<span class="pos">ok</span>':'<span class="neg">unavailable</span>'}</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:6px">Portfolio changes</div>
      <div class="muted" style="font-size:13px">The latest rebalance is summarised by <strong>What changed</strong> on the <a href="#" onclick="setTab('overview');return false;">Overview</a> tab. Full rebalance history, overlay actions and the trade blotter are on the <a href="#" onclick="setTab('trades');return false;">Trades</a> tab.</div>
    </div>`;
}

function renderMethod(){
  const m=DS.meta, sm=DS.weights.sleeve_meta, oc=DS.stats.overlay_compare, rg=DS.regime;
  const sleeveRow=c=>`<tr><td>${sleeveChip(c)} <strong>${esc(sm[c].name)}</strong></td><td class="r num">${pct(sm[c].alloc,0)}</td><td style="font-size:12.5px;color:var(--t2)">${esc(sm[c].desc)}</td></tr>`;
  const cmp=k=>`<tr><td>${k}</td><td class="r num">${k==='max_dd'?pct(oc.ungated[k]):k==='total_return'?pctSigned(oc.ungated[k]):num(oc.ungated[k],2)}</td>
    <td class="r num">${k==='max_dd'?pct(oc.gate_only[k]):k==='total_return'?pctSigned(oc.gate_only[k]):num(oc.gate_only[k],2)}</td>
    <td class="r num"><strong>${k==='max_dd'?pct(oc.deployed[k]):k==='total_return'?pctSigned(oc.deployed[k]):num(oc.deployed[k],2)}</strong></td></tr>`;
  const el=document.getElementById('tabContent');
  el.innerHTML = `
    <div class="card">
      <div class="card-title" style="margin-bottom:10px">What this strategy is</div>
      <p style="font-size:14px;line-height:1.7;color:var(--t2);max-width:860px">
        <strong>${esc(m.name)}</strong> is a systematic, rules-based global ETF rotation model. It blends four independent
        sleeves — US sector breadth, cross-asset trend, thematic momentum and European sector breadth — and overlays two
        risk controls: a breadth de-risk gate and an emerging-market tilt. The book rebalances weekly (Friday close).
        Signals are computed on point-in-time ETF constituents and prices by the upstream engine; this monitor consumes
        that output and recomputes the analytics shown here. The backtest runs from ${fmtDate(m.inception)};
        <strong>${fmtDate(m.oos_start)} onward is treated as out-of-sample</strong> (marked on every performance chart),
        which is also the period the YTD view foregrounds by default.
      </p>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:12px">Sleeves &amp; overlays</div>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Sleeve</th><th class="r">Target</th><th>Mechanism</th></tr></thead>
      <tbody>${['A','B','C','D'].map(sleeveRow).join('')}
        <tr><td>${sleeveChip('TILT')} <strong>${esc(sm.TILT.name)}</strong></td><td class="r num">${pct(sm.TILT.alloc_tilt||0.1,0)}</td><td style="font-size:12.5px;color:var(--t2)">${esc(sm.TILT.desc)}</td></tr>
        <tr><td><span class="sl-chip" style="background:#8a8a82">GATE</span> <strong>Breadth de-risk</strong></td><td class="r num">—</td><td style="font-size:12.5px;color:var(--t2)">Below ${pct(rg.off_threshold,0)} S&amp;P 500 breadth, shift ${pct(rg.derisk_fraction,0)} of NAV to ${rg.fallback_ticker}; re-engage above ${pct(rg.on_threshold,0)}.</td></tr>
      </tbody></table></div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:12px">Value of the overlays (backtest, engine figures)</div>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Metric</th><th class="r">Ungated blend</th><th class="r">+ De-risk gate</th><th class="r">+ EM tilt (deployed)</th></tr></thead>
      <tbody>${['sharpe','cagr','total_return','max_dd'].map(cmp).join('')}</tbody></table></div>
      <div class="card-note" style="margin-top:8px">The de-risk gate is the material risk control: it lifts Sharpe and roughly halves max drawdown. The EM tilt is a marginal, weak-evidence addition.</div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-title" style="margin-bottom:10px">Honest caveats</div>
        <ul style="margin:0 0 0 18px;font-size:13px;line-height:1.8;color:var(--t2)">
          <li><strong>Paper model.</strong> No live capital; not investment advice or an offer.</li>
          <li><strong>In-sample vs out-of-sample.</strong> Parameters were selected over ${fmtDate(m.inception)} to ${fmtDate(m.in_sample_end)}; ${fmtDate(m.oos_start)} onward is out-of-sample. Live results will differ.</li>
          <li><strong>Costs &amp; turnover.</strong> The model turns over ${isNum((DS.trades||{}).ann_turnover)?'≈'+pct(DS.trades.ann_turnover,0)+'/yr':'heavily'}; the backtest charges only ${m.cost_assumption_bps} bps switch cost (no slippage, spread or impact). At realistic costs the CAGR is ~2–3% pa lower — see the cost-sensitivity table on Performance.</li>
          <li><strong>Capacity.</strong> The thematic and single-country sleeves (e.g. solar, lithium, China A-share chips) have limited liquidity; a live fund could not trade them at backtest size.</li>
          <li><strong>EM tilt</strong> rests on few distinct golden-cross events in 7.5 years; treat as a low-conviction positional bet.</li>
          <li><strong>European sleeve</strong> trades EUR-listed instruments; signal-vs-trade instrument can differ (UCITS sibling).</li>
        </ul>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:10px">Data &amp; pipeline</div>
        <ul style="margin:0 0 0 18px;font-size:13px;line-height:1.8;color:var(--t2)">
          <li>Model weights, equity and regime are fetched daily from the <a href="https://github.com/${esc(m.source_repo)}" target="_blank" rel="noopener">${esc(m.source_repo)}</a> engine.</li>
          <li>Benchmarks (S&amp;P 500, 60/40) are fetched independently via yfinance and aligned to the model's dates.</li>
          <li>Every build validates feed freshness, regime consistency and a statistics reconciliation (see Data Health).</li>
          <li>The dashboard reads a single normalised dataset; nothing is hand-edited.</li>
        </ul>
      </div>
    </div>`;
}
