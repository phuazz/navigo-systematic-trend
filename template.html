<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Strategy Portfolio — Model Portfolio Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
<style>
:root{
  --bg:#fafaf8; --bg2:#ffffff; --bg3:#f5f5f0; --bg4:#eeeee8; --bg-hover:#f0f0ea;
  --bd:#e2e0d8; --bd2:#d5d3ca; --bd-strong:#c0beb5;
  --t1:#1a1a18; --t2:#5c5c56; --t3:#8a8a82; --t4:#b0b0a8;
  --g:#1a8754; --g2:#22a366; --g-bg:rgba(26,135,84,0.07); --g-bg2:rgba(26,135,84,0.14);
  --r:#c0392b; --r2:#e74c3c; --r-bg:rgba(192,57,43,0.07); --r-bg2:rgba(192,57,43,0.14);
  --b:#2563eb; --b2:#3b82f6; --b-bg:rgba(37,99,235,0.06); --b-bg2:rgba(37,99,235,0.12);
  --a:#b45309; --a-bg:rgba(180,83,9,0.07); --a-bg2:rgba(180,83,9,0.14);
  --p:#7c3aed; --p-bg:rgba(124,58,237,0.06);
  --c:#0891b2; --c-bg:rgba(8,145,178,0.06);
  /* -text variants per C:\dev\design.md — for TEXT; the values above are for
     fills, borders and large type. At 11px the base colours fail WCAG AA. */
  --g-text:#146c43; --r-text:#a93226; --b-text:#1d4ed8; --a-text:#92400e;
  --p-text:#7c3aed; --c-text:#0e7490; --t3-text:#66665e;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Menlo,monospace;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 6px rgba(0,0,0,0.05),0 2px 4px rgba(0,0,0,0.04);
  --radius:8px; --radius-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding:0 22px 60px}
.shell{max-width:1280px;margin:0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--g-text)} .neg{color:var(--r-text)} .muted{color:var(--t3-text)}
a{color:var(--b-text);text-decoration:none}

/* stale banner */
.stale-banner{margin:16px 0 0;padding:12px 18px;border-radius:var(--radius);font-weight:600;font-size:13px;
  display:flex;align-items:center;gap:10px}
.stale-banner.warn{background:var(--a-bg2);color:var(--a-text);border:1px solid rgba(180,83,9,0.3)}
.stale-banner.stale{background:var(--r-bg2);color:var(--r-text);border:1px solid rgba(192,57,43,0.35)}

/* masthead */
.masthead{padding:26px 0 20px;border-bottom:2px solid var(--t1);margin-bottom:22px;
  display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
.mh-left h1{font-family:var(--serif);font-size:34px;font-weight:400;letter-spacing:-0.4px;line-height:1.05}
.mh-sub{color:var(--t2);font-size:14px;margin-top:4px;max-width:640px}
.mh-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.5px;
  text-transform:uppercase;border:1px solid var(--bd2);background:var(--bg2);color:var(--t2);white-space:nowrap}
.pill-paper{background:var(--a-bg);color:var(--a-text);border-color:rgba(180,83,9,0.3)}
.pill-on{background:var(--g-bg);color:var(--g-text);border-color:rgba(26,135,84,0.3)}
.pill-off{background:var(--r-bg);color:var(--r-text);border-color:rgba(192,57,43,0.3)}
.pill-health-ok{background:var(--g-bg);color:var(--g-text);border-color:rgba(26,135,84,0.3)}
.pill-health-warn{background:var(--a-bg);color:var(--a-text);border-color:rgba(180,83,9,0.3)}
.pill-health-stale{background:var(--r-bg);color:var(--r-text);border-color:rgba(192,57,43,0.3)}

/* headline synthesis — the plain-language read between masthead and KPI strip */
.headline-sent{margin:0 0 18px;font-size:16.5px;line-height:1.55;color:var(--t1);
  /* 940px at 16.5px is 83ch, over MOBILE_CHECK's 65-75 ceiling. Capped in ch
     so the measure holds if the type scale moves; 75ch rather than 66ch
     because this is the masthead lede, not running body prose. */
  letter-spacing:-0.1px;max-width:min(940px,75ch)}
.hs-num{font-weight:700;font-variant-numeric:tabular-nums}
.hs-pos{color:var(--g-text)} .hs-neg{color:var(--r-text)}
.hs-risk{margin-top:7px;font-size:12.5px;color:var(--t3-text);line-height:1.55}
.hs-risk .hs-sep{color:var(--t4);margin:0 6px}
@media(max-width:560px){.headline-sent{font-size:15px;margin-bottom:16px}}

/* what-changed digest */
.wc-sect{font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--t3-text);
  font-weight:700;margin:14px 0 7px}
.wc-sect:first-child{margin-top:0}
/* Rows stay on ONE line at every width: the fund name is the only elastic part,
   so it ellipsises (full text on the title attribute) rather than wrapping and
   pushing the delta onto a third line — which took each row to 85px at 390px. */
.wc-row{display:flex;align-items:baseline;gap:9px;padding:6px 0;font-size:13px;
  border-bottom:1px solid var(--bd)}
.wc-row:last-child{border-bottom:none}
.wc-row .act{font-size:11px;flex:none}          /* 9.5px default is below the floor */
.wc-row strong{flex:none}
.wc-name{color:var(--t3-text);font-size:11.5px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc-w{font-family:var(--mono);font-size:11.5px;flex:none;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.wc-flag{background:var(--a-bg);border:1px solid rgba(180,83,9,0.3);color:var(--a-text);
  padding:9px 13px;border-radius:6px;font-size:12.5px;line-height:1.5;margin-bottom:4px}
.wc-quiet{color:var(--t2);font-size:12.5px;line-height:1.55}
.wc-meta{text-transform:none;letter-spacing:0;font-weight:400;color:var(--t3-text)}

/* KPI strip */
.kpi-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:var(--bd);
  border:1px solid var(--bd);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:22px}
.kpi{background:var(--bg2);padding:14px 16px;min-width:0}
.kpi-label{font-size:11px;color:var(--t3-text);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;margin-bottom:5px}
.kpi-val{font-size:21px;font-weight:700;letter-spacing:-0.5px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi-sub{font-size:11px;color:var(--t3-text);margin-top:3px}
/* Amber inline note inside a kpi sub-line. Used where a tile cannot measure what
   it is for — a dead quote feed — so the reason carries the same weight as the
   warn pills rather than sitting in the same grey as an ordinary caption. */
.kpi-warn{color:var(--a-text);font-weight:600}

/* P&L strip */
/* Five tiles since the intraday figure split into US and Europe sessions.
   auto-fit rather than fixed counts so the row never leaves a ragged empty
   cell, which the 1px gap on a tinted background would render as a stray line. */
.pnl-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;
  background:var(--bd);border:1px solid var(--bd);border-radius:var(--radius-lg);
  overflow:hidden;margin-bottom:18px}
@media(max-width:560px){.pnl-strip{grid-template-columns:1fr}}
.livedot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g);margin-left:5px;vertical-align:middle;animation:pulse 1.8s infinite}
.livedot.off{background:var(--t4);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* tab bar */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--bd);margin-bottom:22px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{padding:11px 18px;font-size:13.5px;font-weight:600;color:var(--t3-text);cursor:pointer;border:none;
  background:none;position:relative;white-space:nowrap;min-height:44px;letter-spacing:0.2px}
.tab:hover{color:var(--t1)}
.tab.active{color:var(--t1)}
.tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--t1)}

/* cards */
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius-lg);
  padding:20px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:700;letter-spacing:-0.2px}
/* Chart captions ran to 92ch at 844px against MOBILE_CHECK's 65-75 target.
   Cap the reading measure the way btetf caps .section-sub; short notes (the
   "x% of NAV" chips in card headers) are already under this and unaffected. */
.card-note{font-size:12px;color:var(--t3-text);max-width:66ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--t3-text);font-weight:700;margin:6px 0 10px}

/* filter buttons */
.fbtn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--bd);
  background:var(--bg2);color:var(--t3-text);min-height:32px}
.fbtn.active{background:var(--t1);color:var(--bg2);border-color:var(--t1)}
.fbtn:hover:not(.active){border-color:var(--t2);color:var(--t2)}
.fbtns{display:flex;gap:6px;flex-wrap:wrap}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{padding:9px 10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.6px;
  color:var(--t3-text);font-weight:700;border-bottom:2px solid var(--bd);background:var(--bg3);white-space:nowrap}
.tbl tbody tr{border-bottom:1px solid var(--bd)}
.tbl tbody tr:hover{background:var(--bg-hover)}
.tbl tbody td{padding:9px 10px;vertical-align:middle}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums} .tbl .c{text-align:center}
.tbl tr.sum{font-weight:700;background:var(--bg3)}
.tbl .num{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}

/* misc chips */
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
.sl-chip{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;color:#fff}
.bar-track{background:var(--bg4);border-radius:4px;height:8px;overflow:hidden;min-width:48px}
.bar-fill{height:100%;border-radius:4px}
.chart{width:100%}
.footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--t3-text);line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv .k{color:var(--t3-text)} .kv .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.callout{background:var(--bg3);border-left:3px solid var(--bd-strong);padding:12px 16px;border-radius:6px;font-size:13px;color:var(--t2);line-height:1.6}
.loading{padding:80px 20px;text-align:center;color:var(--t3-text);font-size:15px}
.hint{background:var(--b-bg);border:1px solid var(--b-bg2);color:var(--b-text);font-size:12.5px;padding:9px 14px;border-radius:8px;margin-bottom:14px}
.filter-input{padding:5px 10px;border:1px solid var(--bd2);border-radius:20px;font-size:12px;font-family:var(--sans);min-height:32px;width:150px;background:var(--bg2);color:var(--t1)}
.filter-input:focus{outline:none;border-color:var(--t2)}
.row-exp{cursor:pointer}
.row-exp:hover{background:var(--bg-hover)}
.exp-ind{display:inline-block;width:12px;color:var(--t3-text);font-size:11px}
.exp-cell{background:var(--bg3);padding:0 !important}
.exp-panel{padding:16px 18px}
.chip{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;margin:0 6px 8px 0;background:var(--bg2);border:1px solid var(--bd);font-variant-numeric:tabular-nums}
.chip-bull{background:var(--g-bg);color:var(--g-text);border-color:rgba(26,135,84,0.3)}
.chip-bear{background:var(--r-bg);color:var(--r-text);border-color:rgba(192,57,43,0.3)}
.act{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.3px;color:#fff;min-width:36px;text-align:center}
.act-new{background:#1a8754} .act-add{background:#22a366} .act-trim{background:#b45309} .act-exit{background:#c0392b} .act-initial{background:#8a8a82}
.act-derisk{background:#c0392b} .act-reengage{background:#1a8754} .act-tilton{background:#0891b2} .act-tiltoff{background:#8a8a82}

@media(max-width:1100px){.kpi-strip{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
/* A grid child floors at min-content unless told otherwise, so a wide
   table inside a .card forced the whole column past the viewport and
   scrolled the body (2026-08-13: attribution/health/signals tabs at
   390px). This lets the card shrink so its own overflow-x wrapper can
   do the scrolling. */
.grid2>*,.grid3>*{min-width:0}
@media(max-width:560px){.kpi-strip{grid-template-columns:repeat(2,1fr)}body{padding:0 12px 50px}.mh-left h1{font-size:27px}}
</style>
</head>
<body>
<div class="shell">
  <div id="staleBanner" class="stale-banner" style="display:none"></div>
  <div class="masthead">
    <div class="mh-left">
      <h1 id="mhTitle">Multi-Strategy Portfolio</h1>
      <div class="mh-sub" id="mhSub">Systematic breadth- and trend-driven global ETF rotation</div>
    </div>
    <div class="mh-right" id="mhRight"></div>
  </div>
  <div id="headlineSent" class="headline-sent" style="display:none"></div>
  <div class="kpi-strip" id="kpiStrip"></div>
  <div class="tab-bar" id="tabBar"></div>
  <div id="tabContent"></div>
  <div class="footer" id="footer"></div>
</div>

<script>
"use strict";
/* ============================ config + state ============================ */
const DATA_FILE = 'data/portfolio-multi-strategy-portfolio.json';
let DS = null;
const state = { tab:'overview', perfWindow:'YTD', perfLog:false, attrHorizon:'1M', attrView:'theme', riskWindow:'SI', benchmarks:null, ovDonut:'sleeve', ovMoversHz:'1W', allocGroup:'sleeve', allocWin:'SI', actFilter:'all', blotAct:'all', blotQ:'' };
const PALETTE = ['#2563eb','#1a8754','#b45309','#7c3aed','#0891b2','#be185d','#a16207','#16a34a','#9333ea','#0d9488','#dc2626','#8a8a82'];
const WIN_OV=['1W','1M','3M','6M','YTD','1Y','SI'], WIN_PERF=['1W','1M','3M','6M','YTD','1Y','3Y','SI'], WIN_RISK=['1W','1M','6M','YTD','1Y','3Y','SI'];
let _blotter=[], _actions=[];   // Trades-tab filterable rows

/* Order follows what gets asked first: what do I hold, what changed, then the
   analysis of it. Allocation and Trades were behind Attribution until
   2026-08-20, which put a contribution decomposition ahead of the positions it
   decomposes. Risk & Regime stays late deliberately — the overlay state is
   already on the Overview headline and masthead pill, so its detail is
   reference material rather than a first question. */
const TABS = [
  ['overview','Overview'], ['allocation','Allocation'], ['trades','Trades'], ['attribution','Attribution'], ['performance','Performance'],
  ['risk','Risk & Regime'], ['signals','Signals'], ['health','Data Health'], ['method','Methodology'],
];
const SLEEVE_COLORS = {A:'#2563eb',B:'#1a8754',C:'#b45309',D:'#7c3aed',TILT:'#0891b2',CASH:'#8a8a82'};

/* ============================ formatting ============================ */
const isNum = v => v!==null && v!==undefined && isFinite(v);
function pct(v,d=1){ if(!isNum(v)) return '—'; let z=v*100; if(Math.abs(z)<Math.pow(10,-d)/2) z=0; return z.toFixed(d)+'%'; }
function pctSigned(v,d=1){ if(!isNum(v)) return '—'; let z=v*100; if(Math.abs(z)<Math.pow(10,-d)/2) z=0; return (z>=0?'+':'')+z.toFixed(d)+'%'; }
const num = (v,d=2) => isNum(v) ? v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}) : '—';
const xfmt = (v,d=2) => isNum(v) ? v.toFixed(d)+'×' : '—';
const signClass = v => !isNum(v) ? '' : v>0 ? 'pos' : v<0 ? 'neg' : '';
const colored = (txt,v) => `<span class="${signClass(v)}">${txt}</span>`;
function fmtDate(s){ if(!s) return '—'; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function fmtDateShort(s){ if(!s) return '—'; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
/* Weekday-carrying form. Every rebalance falls on a Friday and the weekday is
   what makes that convention self-evident, so the digest prints it. Intl does
   the derivation — no weekday is ever computed by hand. */
function fmtDateDow(s){ if(!s) return '—'; const d=new Date(s+'T00:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})
          .replace(',','');   // "Fri, 7 Aug 2026" -> "Fri 7 Aug 2026"
}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============================ Plotly base ============================ */
const PLOT_FONT = {family:'DM Sans',size:11,color:'#5c5c56'};
function baseLayout(extra){
  return Object.assign({
    margin:{t:12,b:38,l:54,r:18}, paper_bgcolor:'transparent', plot_bgcolor:'transparent',
    font:PLOT_FONT, hovermode:'x unified', showlegend:false,
    xaxis:{gridcolor:'#ededea',tickfont:{size:11},zeroline:false},
    yaxis:{gridcolor:'#ededea',tickfont:{size:11,family:'JetBrains Mono'},zeroline:false},
  }, extra||{});
}
const PLOT_CFG = {displayModeBar:false, responsive:true};
function plot(el, traces, layout){ Plotly.react(el, traces, layout, PLOT_CFG); }

/* ============================ data loading ============================ */
async function bootstrap(){
  try{
    const resp = await fetch(DATA_FILE, {cache:'no-cache'});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    DS = await resp.json();
  }catch(e){
    document.getElementById('tabContent').innerHTML =
      `<div class="loading">Could not load <code>${DATA_FILE}</code>.<br><span class="muted">${esc(e.message)}</span><br><br>
       Run <code>python scripts/pipeline.py</code> then serve from the project root or <code>docs/</code>.</div>`;
    return;
  }
  state.benchmarks = Object.keys(DS.equity.benchmarks||{}).filter(k=>DS.equity.benchmarks[k].default);
  if(!state.benchmarks.length) state.benchmarks=['SPY'];
  renderMasthead(); renderHeadline(); renderKPIs(); renderStaleBanner(); renderTabBar(); renderFooter(); renderTab();
}

/* ============================ masthead / KPIs ============================ */
function renderMasthead(){
  const m=DS.meta, rg=DS.regime;
  document.getElementById('mhTitle').textContent = m.name;
  document.getElementById('mhSub').textContent = m.descriptor + ' · weekly-rebalanced · since '+fmtDate(m.inception);
  const onoff = rg.state==='RISK_ON' ? 'on':'off';
  const hl = DS.health.level;
  document.getElementById('mhRight').innerHTML = [
    `<span class="pill pill-paper" title="Paper / model portfolio — not live capital">● Paper model</span>`,
    `<span class="pill pill-${onoff}" title="Breadth de-risk gate state">${rg.state==='RISK_ON'?'Risk-On':'Risk-Off'}</span>`,
    `<span class="pill" title="Latest model NAV date">As of ${fmtDateShort(m.live_asOf||m.asOf)}</span>`,
    // Scoped deliberately. This pill grades the BAKED dataset — feed freshness,
    // regime since-date, recomputed statistics — and knows nothing about the
    // live quote transport, which can be dead while the bake is perfect. A
    // reader who takes "Data OK" as covering the whole page would take it as a
    // freshness claim the pill is in no position to make, so it says which.
    `<span class="pill pill-health-${hl}" title="Integrity of the baked daily dataset. It does not cover the live quote feed — the intraday session tiles report that separately.">${hl==='ok'?'✓ Data OK':hl==='warn'?'⚠ Check data':'✕ Stale'}</span>`,
  ].join('');
}

/* Plain-language synthesis line between the masthead and the KPI strip.
   The KPI strip states eight facts; this states what they add up to.

   Basis discipline. Every figure is a time-weighted return on the model curve.
   The benchmark clauses difference two numbers produced by the SAME function
   (metrics.period_returns) over the SAME window: model and benchmarks both
   anchor YTD on the prior year-end close and both end on the latest dataset
   date. That parity is what makes the "pp ahead" arithmetic legitimate — it is
   the one thing to re-check if the series ever fall out of step. The model
   carries no external flows (target weights, paper), so there is a single
   basis and no money-weighted figure that could be silently mixed in.
   The final model point is a live mark-to-market rather than a settled close;
   the benchmarks carry the same date, so the comparison stays like-for-like. */
function renderHeadline(){
  const el=document.getElementById('headlineSent'); if(!el) return;
  const s=DS.stats||{}, rg=DS.regime||{}, w=DS.weights||{};
  const pr=s.period_returns||{}, bs=s.benchmark_stats||{};
  const ytd=pr.YTD;
  if(!isNum(ytd)) return;              // no YTD, nothing honest to summarise

  const modelEnd=DS.meta.live_asOf||DS.meta.asOf, asOf=fmtDate(modelEnd);
  const spyAsOf=(bs.SPY||{}).asOf||null;
  const spyShort=(spyAsOf&&spyAsOf<modelEnd)?spyAsOf:null;   // benchmark a session short of the NAV
  const ends=spyShort?('the model ending '+asOf+' and the S&P 500 ending '+fmtDate(spyShort)
    +' because its newest bar was not served (see Data Health)'):('both ending '+asOf);
  const tip='Time-weighted return. Model and benchmark YTD come from the same function over '
    +'the same window — both anchored on the prior year-end close, '+ends+'. '
    +'The final model point is a live mark-to-market, not a settled close.';

  let line=`Model <span class="hs-num ${ytd>=0?'hs-pos':'hs-neg'}" title="${esc(tip)}">`
    +`${ytd>=0?'up':'down'} ${pct(Math.abs(ytd),2)}</span> year to date`;

  // Both house comparators. The S&P 500 is the KPI strip's anchor; a global
  // 60/40 is the closer like-for-like read for a global multi-asset rotation,
  // which a single US-equity anchor would flatter or punish on asset mix alone.
  const frags=[];
  // `name` is HTML (entity-encoded); `plain` goes into title attributes, which
  // esc() encodes once — passing the entity form there would double-escape it.
  for(const [key,name,plain] of [['SPY','the S&amp;P 500','the S&P 500'],
                                 ['AOR','global 60/40','global 60/40']]){
    const b=((bs[key]||{}).period_returns||{}).YTD;
    if(!isNum(b)) continue;
    const alpha=ytd-b;
    const bAsOf=(bs[key]||{}).asOf||null;
    const lagTxt=(bAsOf&&bAsOf<modelEnd)?' (to '+fmtDateShort(bAsOf)+')':'';
    const bt=`${tip} Model ${pct(ytd,2)} vs ${plain} ${pct(b,2)}${lagTxt}.`;
    if(Math.abs(alpha)<0.0005){
      frags.push(`<span title="${esc(bt)}">level with ${name}${lagTxt}</span>`);
    }else{
      frags.push(`<span class="hs-num ${alpha>=0?'hs-pos':'hs-neg'}" title="${esc(bt)}">`
        +`${(alpha>=0?'+':'')+(alpha*100).toFixed(2)} pp</span>`
        +`<span title="${esc(bt)}"> ${alpha>=0?'ahead of':'behind'} ${name}${lagTxt}</span>`);
    }
  }
  if(frags.length) line+=', '+frags.join(' and ');

  // Risk facts — computed state only, never an invented policy limit.
  const bits=[`De-risk gate <strong>${rg.state==='RISK_ON'?'risk-on':'risk-off'}</strong> at ${pct(rg.breadth,0)} breadth`];
  const t=rg.eem_tilt||{};
  if(t.enabled) bits.push(`EM tilt ${t.active?'on':'off'}${t.since?' since '+fmtDate(t.since):''}`);
  if(isNum(s.current_dd)) bits.push(Math.abs(s.current_dd)<0.0005?'at its high-water mark'
    :`${pct(Math.abs(s.current_dd),1)} below the high-water mark`);
  if(isNum(w.cash_pct)) bits.push(w.cash_pct<0.0005?'fully invested':`${pct(w.cash_pct,1)} in cash`);
  bits.push('as at '+asOf);

  el.style.display='';
  el.innerHTML=`<div>${line}.</div><div class="hs-risk">${bits.join('<span class="hs-sep">·</span>')}</div>`;
}

function kpiCard(label,val,sub,cls,title){
  return `<div class="kpi"${title?` title="${esc(title)}"`:''}><div class="kpi-label">${label}</div><div class="kpi-val ${cls||''}">${val}</div><div class="kpi-sub">${sub||''}</div></div>`;
}
/* Standard error of an annualised Sharpe, Lo (2002) under the iid assumption:
   SE ~ sqrt((1 + SR^2/2) / years). Computed rather than hard-coded so it tracks
   the sample as it grows -- the engine quotes a fixed "~±0.4" from an earlier
   vintage, and this returns ~0.45 on 7.6 years at SR ~ 1.0.

   It is quoted because the risk-free convention moves this Sharpe by ~0.22
   (raw 1.23 against excess 1.00) and the estimation error is roughly twice
   that. Without the error bar, a reader comparing the two figures across pages
   is arguing inside the noise without being told so. iid is optimistic for a
   trend-following book with autocorrelated returns, so treat it as a floor. */
function sharpeSE(sr, nDays){
  if(!isNum(sr)||!isNum(nDays)||nDays<=0) return null;
  const years = nDays/252;
  return years>0 ? Math.sqrt((1 + sr*sr/2)/years) : null;
}
function renderKPIs(){
  const s=DS.stats, rg=DS.regime;
  const pr=s.period_returns;
  const spySt=(s.benchmark_stats||{}).SPY||{};
  const spyYtd = (spySt.period_returns||{}).YTD;
  const exYtd = (isNum(pr.YTD)&&isNum(spyYtd)) ? pr.YTD - spyYtd : null;
  // The benchmark's own last bar. When it trails the model's end the caveat
  // travels with the number (2026-09-05: SPY a session short, and silent).
  const spyLag = (spySt.asOf && s.end && spySt.asOf < s.end) ? ' to '+fmtDateShort(spySt.asOf) : '';
  const spyLagTip = spyLag ? 'S&P 500 series ends '+fmtDate(spySt.asOf)+' (its newest bar was not served); the model ends '+fmtDate(s.end)+'. See Data Health.' : '';
  const html = [
    kpiCard('vs S&P 500', pctSigned(exYtd), 'YTD excess'+(spyLag?' · S&P'+spyLag:''), signClass(exYtd), spyLagTip),
    kpiCard('YTD', pctSigned(pr.YTD), isNum(spyYtd)?('S&P '+pctSigned(spyYtd)+spyLag):'calendar', signClass(pr.YTD), spyLagTip),
    kpiCard('1 Year', pctSigned(pr['1Y']), 'trailing', signClass(pr['1Y'])),
    kpiCard('CAGR', pct(s.cagr), 'since inception'),
    kpiCard('Ann. Vol', pct(s.ann_vol), 'daily, ×√252'),
    (()=>{                      // Sharpe: state the convention, the alternative and the error bar
      const useExcess=isNum(s.sharpe_excess), shown=useExcess?s.sharpe_excess:s.sharpe;
      const se=sharpeSE(shown, s.n_days);
      const sub=(useExcess?'excess vs T-bills':'rf = 0')+(isNum(se)?` · ±${num(se,2)}`:'');
      const tip=`Sharpe is defined as excess return over the risk-free rate, so this is the `
        +`excess figure: ${num(s.sharpe_excess,2)}, using cash at ${pct(s.cash_cagr,1)} pa. `
        +`Without a risk-free deduction the same series gives ${num(s.sharpe,2)}, which is what `
        +`the upstream engine page reports — a return-to-volatility ratio rather than a Sharpe. `
        +(isNum(se)?`Either way the point estimate carries a standard error of about ${num(se,2)} `
        +`on ${num(s.n_days/252,1)} years (Lo 2002, iid), so the ~${num(Math.abs(s.sharpe-s.sharpe_excess),2)} `
        +`gap between the two conventions is well inside the estimation noise. iid understates the `
        +`error for autocorrelated returns, so read it as a floor.`:'');
      return kpiCard('Sharpe', num(shown,2), sub, '', tip);
    })(),
    kpiCard('Max DD', pct(s.max_dd), 'now '+pct(s.current_dd), 'neg'),
    kpiCard('Breadth', pct(rg.breadth,0), rg.state==='RISK_ON'?'risk-on':'risk-off', rg.state==='RISK_ON'?'pos':'neg'),
  ].join('');
  document.getElementById('kpiStrip').innerHTML = html;
}

/* ============================ equity chart builder ============================ */
function sliceWindow(dates, key){
  const n=dates.length, last=new Date(dates[n-1]+'T00:00:00');
  if(key==='SI') return 0;
  if(key==='YTD'){ const ys=dates.findIndex(d=>d.slice(0,4)===dates[n-1].slice(0,4)); return Math.max(0,ys-1); }
  const days={'1W':7,'1M':30,'3M':91,'6M':183,'1Y':365,'3Y':1095}[key]||99999;
  const cut=new Date(last); cut.setDate(cut.getDate()-days);
  let i=dates.findIndex(d=> new Date(d+'T00:00:00')>=cut); return i<0?0:i;
}
function cumFrom(arr, i0){ const base=arr[i0]; return arr.map((v,i)=> i<i0?null : (v/base-1)); }
function ddFrom(arr, i0){ let peak=-Infinity; return arr.map((v,i)=>{ if(i<i0) return null; peak=Math.max(peak,v); return v/peak-1; }); }

function buildEquityChart(elId, opt){
  opt=opt||{}; state._eqCfg={elId, opt}; const eq=DS.equity, win=opt.window||'SI', log=!!opt.log;
  let dates=eq.dates.slice(), model=eq.model.slice();
  if(eq.live && opt.showLive!==false){ dates=dates.concat(eq.live.dates); model=model.concat(eq.live.equity); }
  const i0=sliceWindow(dates,win), startDate=dates[i0], endDate=dates[dates.length-1], base=model[i0];
  const cum=(v,b)=> v==null?null : (log? v/b : (v/b-1)*100);  // rebase to the window start
  const traces=[];
  traces.push({type:'scatter',mode:'lines',name:'Model',x:dates,y:model.map((v,i)=> i<i0?null:cum(v,base)),
    line:{color:'rgba(26,135,84,0.95)',width:2.2}, fill:log?'none':'tozeroy', fillcolor:'rgba(26,135,84,0.06)',
    hovertemplate:'%{x|%-d %b %Y}<br><b>Model</b> %{y:.1f}'+(log?'×':'%')+'<extra></extra>'});
  if(eq.live && opt.showLive!==false){
    const lx=[eq.live.anchor_date].concat(eq.live.dates);
    const ly=[eq.live.anchor_equity].concat(eq.live.equity).map(v=>cum(v,base));
    traces.push({type:'scatter',mode:'lines+markers',name:'Live (MTM)',x:lx,y:ly,
      line:{color:'rgba(26,135,84,0.95)',width:2,dash:'dot'},marker:{size:5},
      hovertemplate:'%{x|%-d %b %Y}<br><b>Live MTM</b> %{y:.1f}'+(log?'×':'%')+'<extra></extra>'});
  }
  if(opt.showBenchmarks!==false){
    (state.benchmarks||['SPY']).forEach(k=>{ const bm=eq.benchmarks[k]; if(!bm) return;
      let i0b=bm.dates.findIndex(d=> d>=startDate); if(i0b<0) i0b=0; const bbase=bm.equity[i0b];
      traces.push({type:'scatter',mode:'lines',name:bm.label||k,x:bm.dates,y:bm.equity.map((v,i)=> i<i0b?null:cum(v,bbase)),line:{color:bm.color||'#8a8a82',width:1.3},
        hovertemplate:'%{x|%-d %b %Y}<br>'+(bm.label||k)+' %{y:.1f}'+(log?'×':'%')+'<extra></extra>'});
    });
  }
  const layoutExtra={ showlegend:true, legend:{orientation:'h',x:0,y:1.09,font:{size:11}},
    xaxis:{gridcolor:'#ededea',tickfont:{size:11},zeroline:false,range:[startDate,endDate]},
    yaxis:{gridcolor:'#ededea',tickfont:{size:11,family:'JetBrains Mono'},ticksuffix:log?'×':'%',zeroline:!log,zerolinecolor:'#cfcdc4'} };
  if(log) layoutExtra.yaxis.type='log';
  if(opt.showDrawdown){
    const dd=ddFrom(model,i0).map(v=> v===null?null:v*100);
    const ddmin=Math.min(...dd.filter(isNum)); const ddabs=isFinite(ddmin)?Math.abs(ddmin):1;
    traces.push({type:'scatter',mode:'lines',name:'Drawdown',x:dates,y:dd,yaxis:'y2',
      line:{color:'rgba(192,57,43,0.5)',width:0.8},fill:'tozeroy',fillcolor:'rgba(192,57,43,0.13)',hovertemplate:'DD %{y:.1f}%<extra></extra>'});
    layoutExtra.yaxis.domain=[0.27,1];              // returns in the top ~73%
    layoutExtra.yaxis2={domain:[0,0.20],anchor:'x',side:'left',range:[-ddabs*1.08,0.0001],
      ticksuffix:'%',tickfont:{size:11,color:'rgba(192,57,43,0.85)',family:'JetBrains Mono'},
      gridcolor:'#f2efea',zeroline:false,nticks:3};  // drawdown ribbon in the bottom ~20%
  }
  const shapes=[];
  if(opt.showRegime){ let offStart=null;
    DS.regime.events.forEach(e=>{ if(e.direction==='RISK_OFF') offStart=e.date; else if(e.direction==='RISK_ON'&&offStart){
      shapes.push({type:'rect',xref:'x',yref:'paper',x0:offStart,x1:e.date,y0:0,y1:1,fillcolor:'rgba(192,57,43,0.06)',line:{width:0},layer:'below'}); offStart=null; } });
    if(offStart) shapes.push({type:'rect',xref:'x',yref:'paper',x0:offStart,x1:endDate,y0:0,y1:1,fillcolor:'rgba(192,57,43,0.06)',line:{width:0},layer:'below'});
  }
  const anns=[]; const oos=DS.meta.oos_start;
  if(oos && oos>=startDate && oos<=endDate){
    shapes.push({type:'line',xref:'x',yref:'paper',x0:oos,x1:oos,y0:0,y1:1,line:{color:'#1a1a18',width:1.2,dash:'dot'}});
    anns.push({x:oos,xref:'x',y:1.02,yref:'paper',text:'Out-of-sample →',showarrow:false,font:{size:11,color:'#5c5c56'},xanchor:'left'});
  }
  if(opt.showRegime && DS.trades && DS.trades.weekly){   // tie MAJOR rebalances (>8% turnover) to performance
    DS.trades.weekly.forEach(e=>{ const tn=e.turnover||0; if(tn>0.08 && tn<0.9 && e.date>=startDate && e.date<=endDate)
      shapes.push({type:'line',xref:'x',yref:'paper',x0:e.date,x1:e.date,y0:0,y1:1,line:{color:'rgba(37,99,235,0.18)',width:1}}); });
  }
  if(shapes.length) layoutExtra.shapes=shapes;
  if(anns.length) layoutExtra.annotations=anns;
  plot(document.getElementById(elId), traces, baseLayout(layoutExtra));
}

function sleeveChip(code){ const m=DS.weights.sleeve_meta[code]||{name:code}; const col=SLEEVE_COLORS[code]||'#8a8a82';
  return `<span class="sl-chip" style="background:${col}" title="${esc(m.name||code)}">${code}</span>`; }
function tvSymbol(s){ if(!s) return ''; if(s.endsWith('.DE')) return 'XETR:'+s.slice(0,-3); if(s.endsWith('.SZ')) return 'SZSE:'+s.slice(0,-3); return s; }
function windowBtns(cur, keys, fn){ return `<div class="fbtns">`+keys.map(k=>`<button class="fbtn ${cur===k?'active':''}" onclick="${fn}('${k}')">${k}</button>`).join('')+`</div>`; }

/* "What changed" digest — the orienting card on Overview.

   The Portfolio Command Centre runs a prior-DAY digest because it is a
   live-traded book. This model rebalances weekly, so a daily digest would be
   empty most days and would train the reader to ignore the card. The window
   here is therefore the last rebalance, not the last day.

   A weekly card still goes quiet: measured over the 404 rebalances since
   inception, the median moves 11.5% turnover but 4.5% move less than 2%. So
   when the latest rebalance falls in the quietest decile the card says so
   plainly AND shows the last substantive rebalance (at or above the median)
   beneath it. The card is never dead, and it never dresses a quiet week up as
   an eventful one. Both cut-offs are percentiles recomputed from the history
   at run time rather than hard-coded numbers, so they stay true as it grows.

   No elapsed-time arithmetic appears here. Dates are printed absolutely and
   compared as ISO-8601 strings, which order lexicographically — the vault rule
   bars hand-rolled date maths and this template loads no date library. */
function renderWhatChanged(){
  const t=DS.trades||{}, rg=DS.regime||{};
  const latest=latestRebalance();
  if(!latest) return '';

  // Percentiles over completed rebalances, excluding the inception deployment.
  const tw=(t.weekly||[]).slice(1).map(e=>e.turnover).filter(isNum).sort((a,b)=>a-b);
  const pctl=p=> tw.length ? tw[Math.floor(p*(tw.length-1))] : null;
  const p10=pctl(0.10), med=pctl(0.50);
  const quiet=isNum(latest.turnover)&&isNum(p10)&&latest.turnover<p10;

  const sect=(title,meta)=>`<div class="wc-sect">${title}${meta?` <span class="wc-meta">${meta}</span>`:''}</div>`;
  // Turnover counts every move; the rows below are the blotter's selection --
  // every entry and exit, plus resizes of at least 0.5pp. Those are different
  // measures and will not tally, so the count is labelled as "listed" and the
  // rule stated in the footnote, rather than reading as a contradiction against
  // the Trades tab, which reports the unfiltered trade count for the same date.
  const plural=n=>`${n} move${n===1?'':'s'} listed`;
  const row=d=>`<div class="wc-row">${_actChip(d.action)} <strong>${esc(d.ticker)}</strong>`
    +`<span class="wc-name" title="${esc(d.name||'')}">${esc(d.name||'')}</span>`
    +`<span class="wc-w ${signClass(d.delta)}">${pctSigned(d.delta,1)}`
    +` <span class="muted">(${pct(d.from,1)}→${pct(d.to,1)})</span></span></div>`;
  const CAP=5;
  const rows=list=>{
    if(!list.length) return `<div class="wc-quiet">Nothing entered or exited, and no position resized by more than 0.5pp.</div>`;
    const rest=list.length-CAP;
    return list.slice(0,CAP).map(row).join('')
      +(rest>0?`<div class="wc-row"><span class="muted" style="font-size:12px">+${rest} more —`
        +` <a href="#" onclick="setTab('trades');return false;">see the blotter</a></span></div>`:'');
  };

  const lDeltas=latest.deltas||[];
  let body=sect(`Latest rebalance · priced at ${fmtDateDow(latest.date)} close`,
                `${pct(latest.turnover,1)} turnover · ${plural(lDeltas.length)}`)
         + rows(lDeltas);

  if(quiet){
    const wk=t.weekly||[];
    let sub=null;
    for(let i=wk.length-2;i>=1;i--){ if(isNum(wk[i].turnover)&&wk[i].turnover>=med){ sub=wk[i]; break; } }
    body+=`<div class="wc-quiet" style="margin-top:9px">Among the quietest 10% of rebalances since inception`
      +` (below ${pct(p10,1)} turnover; the median is ${pct(med,1)}).${sub?'':' No larger recent rebalance to show.'}</div>`;
    if(sub){
      const sd=blotterAll().filter(b=>b.date===sub.date);
      body+=sect(`Last substantive rebalance · priced at ${fmtDateDow(sub.date)} close`,
                 `${pct(sub.turnover,1)} turnover · ${plural(sd.length)}`) + rows(sd);
    }
  }

  // A gate or tilt switch is rare and material, so one firing at or after the
  // previous rebalance is flagged loudly rather than listed as another row.
  const acts=t.actions||[];
  const ds=(t.alloc_history||{}).dates||[];
  const prevDate=ds.length>1?ds[ds.length-2]:null;
  const fresh=prevDate?acts.filter(a=>a.date>=prevDate):[];
  body+=sect('Overlay');
  if(fresh.length){
    body+=fresh.map(a=>`<div class="wc-flag">${_actionChip(a.action)} <strong>${fmtDate(a.date)}</strong> — ${esc(a.detail)}</div>`).join('');
  }else{
    const tilt=rg.eem_tilt||{};
    body+=`<div class="wc-quiet">No gate or tilt switch at this rebalance. De-risk gate `
      +`<strong>${rg.state==='RISK_ON'?'risk-on':'risk-off'}</strong> since ${fmtDate(rg.since)}`
      +(tilt.enabled?`; EM tilt <strong>${tilt.active?'on':'off'}</strong> since ${fmtDate(tilt.since)}`:'')+`.</div>`;
  }

  // The rows look like a blotter, so the card states plainly that they are not
  // one, and states the execution convention, which is easy to get wrong.
  //
  // Corrected 2026-08-11 after the owner asked whether fills are Monday. They
  // are not. Every sleeve reads its signal at the session BEFORE the rebalance
  // date (prev_idx = get_loc(rd) - 1, normally Thursday), stamps the weights on
  // the Friday, then earns them via weight_panel.shift(1) against close-to-close
  // returns. shift(1) on close-to-close means the new Friday weight earns the
  // Friday-close-to-Monday-close bar, which is only true if the position was
  // established AT Friday's close. So the implied fill is the Friday close, and
  // the signal-to-fill gap is one full session (Thursday close -> Friday close),
  // long enough to work a market-on-close order.
  //
  // The earlier wording here said "decided at the Friday close and first earns
  // on the following session". Both halves misled: the signal is Thursday's, and
  // "first earns on the following session" reads as a Monday fill when the entry
  // price is Friday's close.
  return `<div class="card">
    <div class="card-h"><div class="card-title">What changed</div>

}

/* ---- live intraday (mirrors Portfolio Command Centre: Yahoo chart API via CORS proxy) ---- */

/* Quote transport. Yahoo's chart endpoint sends no Access-Control-Allow-Origin
   header, so this page has always reached it through a public CORS proxy. That
   market has closed. Measured from this origin (https://phuazz.github.io):

     2026-08-28  corsproxy.io  HTTP 401 "A valid API key is required"
                 allorigins    TypeError: Failed to fetch (no ACAO header)
                 six others probed — codetabs, thingproxy, cors.lol,
                 cors.workers.dev, allorigins /get, whateverorigin — none served
                 the Yahoo payload.
     2026-08-29  corsproxy.io  HTTP 401, in 76ms
                 allorigins    0 of 6 concurrent cache-busted requests returned
                               inside 6s; every one timed out. A repeat of a URL
                               already in its edge cache DID return in 23ms, so
                               it is not dead so much as unusable: it serves
                               cached copies of unknown age and hangs on the rest.

   Buying a corsproxy.io key does not rescue this. The repository is public and
   the page is entirely client-side, so a key shipped here is a published key.

   QUOTE_PROXY is therefore a self-hosted Cloudflare Worker, bounded by an
   upstream host allowlist so it cannot act as an open relay. It is shared with
   the Portfolio Command Centre and the COPX trade plan, which sit on this same
   origin and are already inside its ALLOWED_ORIGINS — one deployment serves all
   three. The source and deployment notes are deliberately kept in ONE place
   rather than copied into three repositories where they would drift:

     https://github.com/phuazz/Portfolio-Command-Centre/blob/main/scripts/quote-proxy-worker.mjs

   Set this to the deployed workers.dev URL, no trailing path. Left empty, live
   quotes are simply unavailable — and the card below then says so instead of
   showing a number, which is the entire point of the freshness guard. */
const QUOTE_PROXY = 'https://pcc-quote-proxy.phuaz.workers.dev';

/* The withdrawn public proxies stay as a trailing fallback only, so the page
   self-heals if either restores anonymous access. Neither is the intended path,
   and neither may be trusted to fail quickly — see FETCH_TIMEOUT_MS. */
const PROXIES = [
  ...(QUOTE_PROXY ? [u=>`${QUOTE_PROXY.replace(/\/+$/,'')}/?url=${encodeURIComponent(u)}`] : []),
  u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
];

/* A dead proxy that answers is cheap; a dead proxy that hangs is not. This fetch
   carried no timeout, and on 2026-08-29 allorigins accepted the connection and
   never replied. Measured on the live page: the two intraday tiles sat on
   "fetching live quotes…" for over three minutes before falling through to the
   honest empty state, so the window in which the card was silently wrong was
   not the outage — it was the three minutes of pulsing dots that looked like
   work in progress. 6s is generous against a proxy that answers in 76ms. */
const FETCH_TIMEOUT_MS = 6000;

/* Transport telemetry for the freshness guard, reset at the head of every poll.
   The three outcomes are kept apart because they need different words on the
   tile: `ok` is a quote that arrived and parsed, `dead` is a transport that did
   not answer at all, and `noData` is a transport that answered with a payload
   this page could not use — a delisted symbol, or a prior close that could not
   be established. Only `dead` means the feed is down; collapsing the three into
   one "unavailable" is what makes an outage read like a thin-symbol problem. */
let _fetchStat = { ok:0, dead:0, noData:0 };

let _intraTimer=null;
/* Re-entrancy guard. The poll fires every 60s, and with a hung transport a call
   outlived its own interval — overlapping polls each holding connections open
   against the browser's six-per-host cap, so the queue never drained. */
let _intraBusy=false;
/* The prior close an intraday move is measured against.

   Yahoo's meta on this endpoint frequently omits regularMarketPreviousClose,
   and chartPreviousClose is the close before the WHOLE requested range — five
   sessions back, not the prior session. Falling back to it reported a FIVE-DAY
   return as intraday: on Mon 10 Aug 2026 SPY read +2.09% (773.81 against
   757.67) when the session was +0.04% against Friday's 773.26, and the model
   read +1.55% against a true +0.41%. The vs-SPY figure changed sign, so the
   card claimed underperformance on a day the model was ahead.

   So the prior close is derived from the daily bars in the same response. There
   is deliberately NO fall back to chartPreviousClose: a symbol whose prior
   close cannot be established returns null and drops out, and the card reports
   the reduced coverage. A missing contribution is recoverable; a wrong basis
   folded silently into a weighted total is not. */
function _priorClose(res, m){
  const ts=res.timestamp||[], q=((res.indicators||{}).quote||[{}])[0]||{}, cl=q.close||[];
  const bars=[];
  for(let i=0;i<cl.length;i++) if(cl[i]!=null&&ts[i]!=null) bars.push([ts[i],cl[i]]);
  if(bars.length){
    const utcDay=t=>new Date(t*1000).toISOString().slice(0,10);
    const qd=isNum(m.regularMarketTime)?utcDay(m.regularMarketTime):null;
    // During a session Yahoo appends a partial bar for the quote's own day; the
    // prior close is the bar before it. Before the open there is no such bar,
    // so the newest completed bar already IS the prior close.
    const lastBarIsQuoteDay = qd && utcDay(bars[bars.length-1][0])===qd;
    if(lastBarIsQuoteDay) return bars.length>=2 ? bars[bars.length-2][1] : null;
    return bars[bars.length-1][1];
  }
  return isNum(m.regularMarketPreviousClose) ? m.regularMarketPreviousClose
       : isNum(m.previousClose) ? m.previousClose : null;
}
async function _yfQuote(sym){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=5d&interval=1d&_cb=${Date.now()}`;
  // Set once a proxy returns a body this page could parse. It separates "the
  // transport is down" from "the transport works and Yahoo has nothing usable
  // for this symbol", which the tile has to tell apart to say anything true.
  let transportOk=false;
  for(const p of PROXIES){
    try{
      const r=await fetch(p(url),{cache:'no-store',signal:AbortSignal.timeout(FETCH_TIMEOUT_MS)});
      if(!r.ok) continue;                                  // this proxy failed; try the next
      const j=await r.json();
      transportOk=true;
      const res=j&&j.chart&&j.chart.result&&j.chart.result[0]; const m=res&&res.meta; if(!m) break;
      const price=m.regularMarketPrice, prev=_priorClose(res,m);
      if(isNum(price)&&isNum(prev)&&prev){ _fetchStat.ok++; return {ret:price/prev-1, t:m.regularMarketTime}; }
      // A parsed payload without a usable price is Yahoo's answer, not the
      // proxy's. Asking a second proxy for the same URL returns the same thing.
      break;
    }catch(e){}
  }
  if(transportOk) _fetchStat.noData++; else _fetchStat.dead++;
  return null;
}
async function _pool(items, fn, n=5){
  const out=new Array(items.length); let i=0;
  const worker=async()=>{ while(i<items.length){ const idx=i++; out[idx]=await fn(items[idx]); } };
  await Promise.all(Array.from({length:Math.min(n,items.length)}, worker));
  return out;
}
function startIntraday(){ if(_intraTimer){clearInterval(_intraTimer);_intraTimer=null;} refreshIntraday(); _intraTimer=setInterval(refreshIntraday, 60000); }
/* Liveness is judged PER HOLDING, not by the newest quote in the book.

   The old test was Math.max over every quote timestamp, so a single open
   market held the whole card in the live branch. Measured Wed 19 Aug 2026 at
   08:24 New York -- Xetra open, US pre-market -- the card read "Intraday P&L
   -1.05% · SPY -0.68% · live" while 85.9% of NAV was still quoting the
   previous close. The figure was mostly yesterday's session wearing a live dot,
   the same class of fault as the chartPreviousClose bug: a real number on the
   wrong basis, confidently labelled.

   Two rules now. A holding counts as live only if ITS OWN quote is under
   FRESH_MIN old, and only live holdings contribute -- a stale name adds
   nothing rather than adding yesterday. And the card claims an intraday read
   only when live holdings clear LIVE_MIN_COVERAGE of NAV; below that it falls
   through to the last completed session, saying how little is actually trading.

   The SPY comparator is held to the same test. Differencing a live portfolio
   move against a stale index is the like-for-like error in miniature, and is
   exactly what produced that "SPY -0.68%". */
const FRESH_MIN = 30;             // minutes; an older quote is not "now"
const LIVE_MIN_COVERAGE = 0.50;   // share of a VENUE's own weight that must be trading

/* Venues are split because the two sessions barely overlap.

   A single blended intraday figure failed this book in both directions. During
   the European session it read as a live portfolio move while ~80% of NAV was
   quoting the previous US close; gating that on 50% of TOTAL NAV then made the
   card dark for the whole European session instead, because Xetra can never
   reach half the book. Neither is a fair reading of "how is the portfolio doing
   right now" for a portfolio that trades in two time zones.

   Each tile is therefore the NAV CONTRIBUTION of its own venue -- weight times
   return, not the venue's internal return -- so US and Europe are additive and
   sum to the portfolio's live move. The sub-line says "of NAV" for that reason:
   a +0.42% US tile on a 78% sleeve means the US holdings moved ~0.54%, and the
   tooltip gives that figure so the distinction cannot be misread.

   Classification is by the quote symbol's suffix, which is what actually
   determines the trading calendar. Anything matching neither list falls to a
   residual that is reported on both tiles when material rather than silently
   dropped -- today that is 159801.SZ at 2% of NAV on the Shenzhen calendar. */
const EU_SUFFIX = /\.(DE|L|PA|AS|MI|SW|MC|BR|VI|ST|CO|HE|IR|LS)$/i;
const VENUES = [
  {key:'us', label:'US session', match:s=>!s.includes('.'),
   tip:'NAV contribution of US-listed holdings whose own quote is under 30 minutes old, '
      +'measured against the prior US close. Contribution, not the venue return: a figure '
      +'here plus the Europe tile equals the portfolio move so far. Shows "Closed" when '
      +'under half of the US sleeve is quoting live; the 1-Day tile carries the last '
      +'completed session for the whole book.'},
  {key:'eu', label:'Europe session', match:s=>EU_SUFFIX.test(s),
   tip:'NAV contribution of European-listed holdings (Xetra and peers) whose own quote is '
      +'under 30 minutes old, measured against the prior European close and quoted in local '
      +'currency, so it excludes the EUR/USD move the USD book actually carries. '
      +'Contribution, not the venue return. Shows "Closed" when under half of the European '
      +'sleeve is quoting live.'},
];
function venueOf(sym){
  for(const v of VENUES) if(v.match(sym)) return v.key;
  return 'other';
}
async function refreshIntraday(){
  if(!document.getElementById('ov-us')){ if(_intraTimer){clearInterval(_intraTimer);_intraTimer=null;} return; }  // left Overview
  if(_intraBusy) return;                                     // a slow poll is still running
  _intraBusy=true;
  try{ await _refreshIntradayInner(); } finally { _intraBusy=false; }
}
async function _refreshIntradayInner(){
  _fetchStat={ok:0, dead:0, noData:0};                        // this poll only
  const rows=DS.weights.rows.filter(r=>(r.weight||0)>1e-4);
  const quotes=await _pool(rows, r=>_yfQuote(r.tradeAs||r.ticker), 5);
  const spyQ=await _yfQuote('SPY');
  if(!document.getElementById('val-us')) return;              // tab switched mid-fetch

  /* The freshness guard. `feedDown` is true only when every attempt failed at
     the transport — not when the quotes arrived and said the market is shut.
     The distinction is the whole point: "Closed" is a fact about the calendar
     that the page is entitled to state, whereas a dead transport leaves it
     entitled to state nothing at all, and the two must not share a caption. */
  const feedDown = _fetchStat.ok===0 && _fetchStat.dead>0;
  const feedPartial = _fetchStat.ok>0 && _fetchStat.dead>0;
  const bakedTo = fmtDateShort(DS.meta.live_asOf||DS.meta.asOf);
  const feedNote = feedPartial ? ` · <span class="kpi-warn">${_fetchStat.dead} quote${_fetchStat.dead===1?'':'s'} missing</span>` : '';

  const nowS=Date.now()/1000, ageMinOf=q=>(q&&isNum(q.t))?(nowS-q.t)/60:Infinity;
  const agg={};                                               // per venue, plus 'other'
  const bucket=k=>(agg[k]=agg[k]||{pnl:0, liveW:0, totW:0, anyW:0, tLive:0, tAny:0});
  rows.forEach((r,i)=>{
    const sym=r.tradeAs||r.ticker, w=r.weight||0, b=bucket(venueOf(sym)), q=quotes[i];
    b.totW+=w;                                                // denominator: everything held here
    if(!q||!isNum(q.ret)) return;
    b.anyW+=w; if(q.t) b.tAny=Math.max(b.tAny,q.t);
    if(ageMinOf(q)<FRESH_MIN){ b.liveW+=w; b.pnl+=w*q.ret; if(q.t) b.tLive=Math.max(b.tLive,q.t); }
  });
  const spyLive = spyQ && isNum(spyQ.ret) && ageMinOf(spyQ)<FRESH_MIN;
  const other=agg.other||{totW:0};
  const residual=other.totW>0.005 ? ` · ${Math.round(other.totW*100)}% of NAV on other calendars` : '';
  const hhmm=t=>new Date(t*1000).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

  for(const v of VENUES){
    const b=bucket(v.key);
    const valEl=document.getElementById('val-'+v.key), subEl=document.getElementById('sub-'+v.key),
          dot=document.getElementById('dot-'+v.key);
    if(!valEl) continue;
    if(b.totW<1e-4){                                          // sleeve not held at all
      valEl.textContent='—'; valEl.className='kpi-val muted'; valEl.style.fontSize='17px';
      subEl.textContent='not held'; if(dot) dot.className='livedot off'; continue;
    }
    if(b.anyW<0.01){
      // Nothing to measure. Say WHY, and name the vintage the reader is
      // actually looking at, so an outage cannot be mistaken for a quiet tape.
      valEl.textContent='—'; valEl.className='kpi-val muted'; valEl.style.fontSize='17px';
      subEl.innerHTML = feedDown
        ? `<span class="kpi-warn">quote feed down</span> · baked to ${bakedTo} · see 1-Day`
        : `no usable quotes for this sleeve · baked to ${bakedTo} · see 1-Day`;
      if(dot) dot.className='livedot off'; continue;
    }
    // Liveness is measured against this venue's OWN weight, not the whole book:
    // Xetra can never reach half of NAV, so a total-NAV gate would keep it dark.
    const share=b.liveW/b.totW;
    if(share>=LIVE_MIN_COVERAGE){
      valEl.textContent=pctSigned(b.pnl,2); valEl.className='kpi-val '+signClass(b.pnl); valEl.style.fontSize='';
      if(dot) dot.className='livedot';
      const venueRet=b.liveW>0 ? b.pnl/b.liveW : null;         // what the sleeve itself did
      const ex=(v.key==='us'&&spyLive)? b.pnl-spyQ.ret*b.liveW : null;   // like-for-like: scale SPY to the same weight
      subEl.innerHTML=`of NAV · ${Math.round(b.totW*100)}% sleeve`
        +(isNum(venueRet)?` moved ${pctSigned(venueRet,2)}`:'')
        +(isNum(ex)?` · vs SPY <span class="${signClass(ex)}">${pctSigned(ex,2)}</span>`:'')
        +` · live ${hhmm(b.tLive||b.tAny)}`
        +(share<0.95?` · ${Math.round(share*100)}% quoting`:'')+residual+feedNote;
    }else{
      if(dot) dot.className='livedot off';
      valEl.textContent='Closed'; valEl.className='kpi-val muted'; valEl.style.fontSize='17px';
      const qd=b.tAny? fmtDateShort(new Date(b.tAny*1000).toISOString().slice(0,10)) : '';
      subEl.innerHTML=`${Math.round(b.totW*100)}% of NAV`+(qd?` · quotes ${qd}`:'')
        +(b.liveW>0.005?` · only ${Math.round(share*100)}% quoting`:'')
        +` · see 1-Day`+residual+feedNote;
    }
  }
}

/* ============================ client-side stats (model + benchmarks) ============================ */
const mean = a => a.reduce((x,y)=>x+y,0)/(a.length||1);
function arrReturns(eq){ const r=[]; for(let i=1;i<eq.length;i++){ if(isNum(eq[i])&&isNum(eq[i-1])&&eq[i-1]) r.push(eq[i]/eq[i-1]-1);} return r; }
function statsOf(eq, dates){
  const idx=eq.map((v,i)=>i).filter(i=>isNum(eq[i]));
  if(idx.length<2) return {};
  const i0=idx[0], i1=idx[idx.length-1];
  const r=arrReturns(eq.slice(i0,i1+1));
  const days=(new Date(dates[i1]+'T00:00:00')-new Date(dates[i0]+'T00:00:00'))/86400000;
  const m=mean(r), sd=Math.sqrt(mean(r.map(x=>(x-m)**2))*r.length/Math.max(1,r.length-1));
  const dn=r.filter(x=>x<0), dsd=Math.sqrt(mean(dn.map(x=>x*x))||0);
  let peak=-Infinity,mdd=0; for(let i=i0;i<=i1;i++){ if(!isNum(eq[i])) continue; peak=Math.max(peak,eq[i]); mdd=Math.min(mdd,eq[i]/peak-1);}
  const cagr=Math.pow(eq[i1]/eq[i0],365.25/days)-1;
  return {totret:eq[i1]/eq[i0]-1, cagr, vol:sd*Math.sqrt(252), sharpe:sd?m/sd*Math.sqrt(252):null,
    sortino:dsd?m/dsd*Math.sqrt(252):null, maxdd:mdd, calmar:mdd?cagr/Math.abs(mdd):null,
    hit:r.filter(x=>x>0).length/r.length, best:Math.max(...r), worst:Math.min(...r)};
}
function rollingSeries(eq, dates, win){
  const ret=[], vol=[], x=[];
  for(let i=win;i<eq.length;i++){ if(!isNum(eq[i])||!isNum(eq[i-win])) continue;
    x.push(dates[i]); ret.push(eq[i]/eq[i-win]-1);
    const r=arrReturns(eq.slice(i-win,i+1)); const m=mean(r); const sd=Math.sqrt(mean(r.map(v=>(v-m)**2)));
    vol.push(sd*Math.sqrt(252)); }
  return {x,ret,vol};
}

function buildRolling(){
  const eq=DS.equity, n=eq.dates.length;

  const sr=rollingSeries(spyEq, eq.dates, 252);
  const rel=mr.ret.map((v,i)=> (isNum(v)&&isNum(sr.ret[i]))? (v-sr.ret[i])*100 : null);
  plot(document.getElementById('perfRolling'),[
    {type:'scatter',mode:'lines',name:'Relative (model−S&P)',x:mr.x,y:rel,yaxis:'y2',
      line:{width:0},fill:'tozeroy',fillcolor:'rgba(37,99,235,0.13)',hovertemplate:'rel %{y:.0f}%<extra></extra>'},
    {type:'scatter',mode:'lines',name:'Model 12m',x:mr.x,y:mr.ret.map(v=>v*100),line:{color:'#1a8754',width:1.6},hovertemplate:'%{x|%b %Y}<br>model %{y:.0f}%<extra></extra>'},
    {type:'scatter',mode:'lines',name:'S&P 12m',x:sr.x,y:sr.ret.map(v=>v==null?null:v*100),line:{color:'#8a8a82',width:1.4},hovertemplate:'S&P %{y:.0f}%<extra></extra>'},
  ], baseLayout({showlegend:true,legend:{orientation:'h',x:0,y:1.12,font:{size:11}},
    yaxis:{gridcolor:'#ededea',ticksuffix:'%',tickfont:{size:11,family:'JetBrains Mono'},zeroline:true,zerolinecolor:'#cfcdc4'},

}
function buildUnderwater(){
  const eq=DS.equity; let peak=-Infinity; const dd=eq.model.map(v=>{ peak=Math.max(peak,v); return (v/peak-1)*100; });
  plot(document.getElementById('perfDD'),[{type:'scatter',mode:'lines',x:eq.dates,y:dd,line:{color:'rgba(192,57,43,0.6)',width:1},fill:'tozeroy',fillcolor:'rgba(192,57,43,0.12)',hovertemplate:'%{x|%b %Y}<br>DD %{y:.1f}%<extra></extra>'}],
    baseLayout({yaxis:{gridcolor:'#ededea',ticksuffix:'%',tickfont:{size:11,family:'JetBrains Mono'},rangemode:'tozero'}}));
}
function buildPerfStats(){
  const eq=DS.equity;
  const cols=[['Model',eq.model,eq.dates,'#1a8754']];
  if(eq.benchmarks.SPY) cols.push(['S&P 500',eq.benchmarks.SPY.equity,eq.benchmarks.SPY.dates,'#8a8a82']);
  if(eq.benchmarks.BAL6040) cols.push(['60/40',eq.benchmarks.BAL6040.equity,eq.benchmarks.BAL6040.dates,'#b0b0a8']);
  const st=cols.map(c=>statsOf(c[1],c[2]));
  const cap=DS.stats.capture;
  const rows=[
    ['Total return', st.map(x=>pctSigned(x.totret))],
    ['CAGR', st.map(x=>pct(x.cagr))],
    ['Ann. volatility', st.map(x=>pct(x.vol))],
    ['Sharpe (rf=0)', st.map(x=>num(x.sharpe,2))],
    ['Sortino', st.map(x=>num(x.sortino,2))],
    ['Max drawdown', st.map(x=>pct(x.maxdd))],
    ['Calmar', st.map(x=>num(x.calmar,2))],
    ['Hit rate (days)', st.map(x=>pct(x.hit,0))],
    ['Best day', st.map(x=>pctSigned(x.best))],
    ['Worst day', st.map(x=>pctSigned(x.worst))],
    ['Beta vs S&P', cols.map((c,i)=> i===0?num((cap.SPY||{}).beta,2): c[0]==='S&P 500'?'1.00':'—')],
    ['Up capture vs S&P', cols.map((c,i)=> i===0?num((cap.SPY||{}).up_capture,2):'—')],
    ['Down capture vs S&P', cols.map((c,i)=> i===0?num((cap.SPY||{}).down_capture,2):'—')],
  ];
  const head=`<thead><tr><th>Metric</th>${cols.map(c=>`<th class="r"><span class="dot" style="background:${c[3]}"></span>${c[0]}</th>`).join('')}</tr></thead>`;
  const body=rows.map(([lab,vals])=>`<tr><td>${lab}</td>${vals.map(v=>`<td class="r num">${v}</td>`).join('')}</tr>`).join('');
  document.getElementById('perfStats').innerHTML=head+'<tbody>'+body+'</tbody>';
}
function buildCostTable(){
  const tn=DS.trades.ann_turnover, gross=DS.stats.cagr, base=DS.meta.cost_assumption_bps||5, el=document.getElementById('costBody');
  if(!el||!isNum(tn)||!isNum(gross)) return;
  const grossOfAll = gross + tn*2*base/1e4;                  // add back the assumed cost to get pre-cost CAGR
  el.innerHTML=[5,10,15,20,30].map(bps=>{ const drag=tn*2*bps/1e4, net=grossOfAll-drag;
    return `<tr${bps===base?' class="sum"':''}><td class="num">${bps} bps${bps===base?' · assumed':''}</td>
      <td class="r num neg">−${(drag*100).toFixed(2)}%</td><td class="r num">${pct(net,1)}</td></tr>`; }).join('');
}
function buildHeatmap(){
  const mm=DS.monthly; const years=Object.keys(mm).sort();
  const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let maxAbs=0.0001; years.forEach(y=>MO.forEach((_,i)=>{ const v=mm[y][i+1]; if(isNum(v)) maxAbs=Math.max(maxAbs,Math.abs(v)); }));
  const cell=v=>{ if(!isNum(v)) return '<td style="background:var(--bg3)"></td>';
    const a=Math.min(0.82, Math.abs(v)/maxAbs*0.8+0.06); const col=v>=0?`rgba(26,135,84,${a})`:`rgba(192,57,43,${a})`;
    return `<td class="num" style="background:${col};text-align:right;font-size:11px;padding:6px 8px;color:${Math.abs(v)/maxAbs>0.5?'#fff':'var(--t1)'}">${(v*100).toFixed(1)}</td>`; };
  const head=`<tr><th>Year</th>${MO.map(m=>`<th class="r" style="font-size:11px">${m}</th>`).join('')}<th class="r">Year</th></tr>`;
  const body=years.map(y=>`<tr><td><strong>${y}</strong></td>${MO.map((_,i)=>cell(mm[y][i+1])).join('')}
    <td class="num ${signClass(mm[y].YEAR)}" style="text-align:right;font-weight:700">${pctSigned(mm[y].YEAR)}</td></tr>`).join('');
  document.getElementById('perfHeatmap').innerHTML=`<table class="tbl" style="font-size:11px"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function attrRows(){
  const hz=state.attrHorizon;
  if(state.attrView==='sleeve'){
    return Object.entries(DS.attribution.sleeve).map(([code,r])=>({label:code,name:r.name,color:SLEEVE_COLORS[code]||'#888',
      ret:(r[hz]||{}).ret, contrib:(r[hz]||{}).contrib, alloc:r.alloc})).filter(r=>isNum(r.contrib));
  }
  if(state.attrView==='theme'){
    const g={};
    DS.attribution.etf.forEach(r=>{ const h=r[hz]||{}; if(!isNum(h.contrib)) return; const t=r.theme||'Other';
      g[t]=g[t]||{label:t,name:t,weight:0,contrib:0,_sl:{}}; g[t].weight+=r.weight||0; g[t].contrib+=h.contrib;
      g[t]._sl[r.sleeve]=(g[t]._sl[r.sleeve]||0)+(r.weight||0); });
    return Object.values(g).map(x=>{ x.ret=x.weight?x.contrib/x.weight:null;
      const dom=Object.entries(x._sl).sort((a,b)=>b[1]-a[1])[0]; x.color=SLEEVE_COLORS[dom&&dom[0]]||'#2563eb'; return x; });
  }
  return DS.attribution.etf.map(r=>({label:r.ticker,name:r.name,sleeve:r.sleeve,color:SLEEVE_COLORS[r.sleeve]||'#888',
    ret:(r[hz]||{}).ret, contrib:(r[hz]||{}).contrib, weight:r.weight, vol:r.vol, risk_pct:r.risk_pct, ret_1y:r.ret_1y})).filter(r=>isNum(r.contrib));
}
function buildAttrChart(){
  const rows=attrRows().sort((a,b)=>b.contrib-a.contrib);

    x:rows.map(r=>r.contrib*100).reverse(), y:rows.map(r=>r.label).reverse(),

function volOf(arr){ const r=arrReturns((arr||[]).slice(-253).filter(isNum)); if(r.length<2) return null;
  const m=mean(r); return Math.sqrt(mean(r.map(x=>(x-m)**2)))*Math.sqrt(252); }
function attrScatterNodes(){
  // Nodes follow the contribution view (ETF/theme/sleeve); y = selected horizon
  // return, x = annualised volatility (a ~1y risk characteristic).
  const hz=state.attrHorizon, v=state.attrView, rk=(DS.risk||{}).by_ticker||{};
  const etfRet=e=> hz==='SI' ? e.ret_1y : (e[hz]||{}).ret;   // ETFs have no since-inception price → use 1Y
  if(v==='sleeve'){
    return Object.entries(DS.attribution.sleeve).map(([code,r])=>({label:code,color:SLEEVE_COLORS[code]||'#888',
      x:volOf((DS.equity.sleeves||{})[code]), y:(r[hz]||{}).ret, size:r.alloc}));
  }
  if(v==='theme'){
    const g={};
    DS.attribution.etf.forEach(e=>{ const t=e.theme||'Other', w=e.weight||0, ret=etfRet(e), vol=(rk[e.ticker]||{}).vol;
      g[t]=g[t]||{label:t,w:0,rw:0,vw:0,_sl:{}}; g[t].w+=w; if(isNum(ret))g[t].rw+=w*ret; if(isNum(vol))g[t].vw+=w*vol;
      g[t]._sl[e.sleeve]=(g[t]._sl[e.sleeve]||0)+w; });
    return Object.values(g).map(x=>{ const dom=Object.entries(x._sl).sort((a,b)=>b[1]-a[1])[0];
      return {label:x.label,color:SLEEVE_COLORS[dom&&dom[0]]||'#2563eb',x:x.w?x.vw/x.w:null,y:x.w?x.rw/x.w:null,size:x.w}; });
  }
  return DS.attribution.etf.map(e=>({label:e.ticker,color:SLEEVE_COLORS[e.sleeve]||'#888',
    x:(rk[e.ticker]||{}).vol, y:etfRet(e), size:e.weight}));
}

function pearson(a,b){ const n=Math.min(a.length,b.length); const x=a.slice(0,n),y=b.slice(0,n);

  return (sx&&sy)? sxy/Math.sqrt(sx*sy):null; }

function sparkSVG(ticker){
  const h=(DS.holdings_prices||{})[ticker]; if(!h||!h.close) return '<span class="muted">—</span>';
  const close=h.close, ma=h.ma200||[], n=close.length, W=120,H=26,pad=2;
  const vals=close.filter(isNum); if(vals.length<3) return '<span class="muted">—</span>';
  const mn=Math.min(...vals), mx=Math.max(...vals), rng=(mx-mn)||1;
  const X=i=> pad+(i/(n-1))*(W-2*pad), Y=v=> H-pad-((v-mn)/rng)*(H-2*pad);
  let segs=[],cur=null,sign=null;
  for(let i=0;i<n;i++){ if(!isNum(close[i])) continue;
    const s=(isNum(ma[i])&&close[i]>=ma[i])?1:-1;
    if(s!==sign){ if(cur&&cur.length) segs.push({s:sign,pts:cur}); cur=[]; sign=s; if(i>0&&isNum(close[i-1])) cur.push([X(i-1),Y(close[i-1])]); }
    cur.push([X(i),Y(close[i])]); }
  if(cur&&cur.length) segs.push({s:sign,pts:cur});
  const polys=segs.map(g=>`<polyline fill="none" stroke="${g.s>=0?'#1a8754':'#c0392b'}" stroke-width="1.3" points="${g.pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="vertical-align:middle" title="1-year price; green = above 200-day MA, red = below">${polys}</svg>`;
}

/* Shared rebalance reconstruction. _buildBlotterFromMatrix walks every weekly
   rebalance × every ticker; the Overview digest and the Trades tab both need
   the result and must never disagree about it, so it is built once and cached.
   The cache is keyed to nothing because DS is loaded once per page load. */
let _blotAll=null;
function blotterAll(){
  if(_blotAll) return _blotAll;
  const t=DS.trades||{}, ah=t.alloc_history;
  if(ah&&ah.dates&&ah.dates.length){ _blotAll=_buildBlotterFromMatrix(); }
  else{ _blotAll=[]; (t.log||[]).forEach(e=>(e.deltas||[]).forEach(d=>_blotAll.push(Object.assign({date:e.date},d)))); }
  return _blotAll;
}
/* The most recent rebalance, resolved identically for both consumers. Mirrors
   the original Trades-tab logic, including its fallback when the weight matrix
   carries a date but no delta above the blotter's 0.5pp reporting threshold. */
function latestRebalance(){
  const t=DS.trades||{}, ah=t.alloc_history, bl=blotterAll();
  if(ah&&ah.dates&&ah.dates.length){
    const li=ah.dates.length-1;
    let deltas=bl.filter(b=>b.date===ah.dates[li]);
    if(!deltas.length&&bl.length) deltas=bl.filter(b=>b.date===bl[0].date);
    return {date:(deltas[0]?deltas[0].date:ah.dates[li]),
            type: ah.dates.length===1?'initial':'rebalance',
            turnover:(t.weekly&&t.weekly[li]?t.weekly[li].turnover:null),
            n:deltas.length, deltas};
  }
  const log=t.log||[];
  return log.length?log[0]:null;
}
function _buildBlotterFromMatrix(){
  const ah=DS.trades.alloc_history; if(!ah) return [];
  const dates=ah.dates, W=ah.weights, nm=ah.ticker_name||{}, sl=ah.ticker_sleeve||{}, out=[];
  const tickers=Object.keys(W).filter(t=>t!=='Other');
  /* Sleeve NAV totals per rebalance, so a holding's WITHIN-SLEEVE weight can be
     recovered as its NAV weight over its sleeve's. The engine reports both bases
     and they answer different questions: within-sleeve says how the rotation
     ranked a name against its peers, NAV says what it is worth to the book.
     A name can gain conviction inside its sleeve while losing NAV weight, if the
     overlay is de-risking or the sleeve allocation moved.

     Derived rather than fetched, and verified exact against the engine's own
     headline.trade_history: sleeve A at 2026-08-14 recovers IUFS 25.2%, IUES
     19.7%, IUHC 19.4%, SOXX 16.2%, IUSP 14.3%, IUIS 3.8%, CSP1 1.4% -- the
     engine's published figures to the decimal, with no new feed.

     'Other' is excluded: it is the folded long tail, carries sleeve 'Other', and
     would otherwise dilute a real sleeve's denominator. */
  const sleeveTot=dates.map((_,i)=>{
    const m={};
    for(const t of tickers){ const s=sl[t]; if(!s||s==='Other') continue; m[s]=(m[s]||0)+(W[t][i]||0); }
    return m;
  });
  const within=(t,i)=>{ const s=sl[t]; if(!s||s==='Other') return null;
    const tot=sleeveTot[i][s]||0; return tot>1e-9 ? (W[t][i]||0)/tot : null; };
  /* Entries and exits are listed however small; only resizes must clear 0.5pp.
     The flat threshold hid them: CSP1 entered sleeve A on 2026-08-14 at 0.5% of
     NAV, exactly on the boundary, so a genuine new position was filtered out
     while a 0.6pp trim survived. Crossing zero is a decision about whether to
     own something at all, which a small weight does not make immaterial. */
  for(let i=1;i<dates.length;i++){
    for(const t of tickers){ const f=W[t][i-1]||0, c=W[t][i]||0, d=c-f;
      const isEntry=f<=1e-4&&c>1e-4, isExit=f>1e-4&&c<=1e-4;
      if(Math.abs(d)>0.005||isEntry||isExit){
        const action=isEntry?'NEW':(isExit?'EXIT':(c>f?'ADD':'TRIM'));
        out.push({date:dates[i], ticker:t, name:nm[t]||t, sleeve:sl[t]||'',
                  from:f, to:c, delta:d, action,
                  wFrom:within(t,i-1), wTo:within(t,i)}); } }
  }
  out.sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:Math.abs(b.delta)-Math.abs(a.delta));   // newest first, biggest first
  return out;
}
